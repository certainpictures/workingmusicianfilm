      <script nonce="e08b3b83af56d9bd2e4201c8">
        // Safari iOS recovery from stale cross-origin iframes. Two scenarios can
        // leave embedded GA/YouTube/Reddit iframes with mismatched origins, which
        // breaks postMessage and crashes GA4’s outbound-link-click wrapper:
        //
        //   1. bfcache restore — user navigates away then taps Back. Caught by
        //      pageshow + event.persisted.
        //   2. tab-resume — user taps a target="_blank" link, the l.ink tab is
        //      backgrounded, Safari suspends it to save memory, user returns.
        //      pageshow.persisted is false here; only visibilitychange fires.
        //
        // Both handlers reload to tear down the stale references. The
        // visibilitychange handler only fires when the page was hidden long
        // enough for Safari to actually suspend it — quick tab-flicks under the
        // threshold are ignored so users don’t see reloads from normal switching.
        window.addEventListener("pageshow", function(event) {
          if (event.persisted) {
            window.location.reload();
          }
        });

        var easyLinks_hiddenAt = null;
        var EASY_LINKS_TAB_RESUME_THRESHOLD_MS = 1000;
        document.addEventListener("visibilitychange", function() {
          if (document.visibilityState === "hidden") {
            easyLinks_hiddenAt = Date.now();
          } else if (document.visibilityState === "visible" && easyLinks_hiddenAt) {
            var hiddenMs = Date.now() - easyLinks_hiddenAt;
            easyLinks_hiddenAt = null;
            if (hiddenMs > EASY_LINKS_TAB_RESUME_THRESHOLD_MS) {
              window.location.reload();
            }
          }
        });
      </script>
